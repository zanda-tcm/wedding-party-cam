<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Zanda & Emma's Wedding Party Cam</title>

  <style>
    :root {
      --background: #f5f1ea;
      --text: #252525;
      --accent: #8b7355;
      --white: #ffffff;
      --danger: #a43d3d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 18px 40px;
      background: var(--background);
      color: var(--text);
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
    }

    h1 {
      margin: 12px 0 6px;
      font: normal 34px Georgia, serif;
    }

    .subtitle {
      margin: 0 0 18px;
      line-height: 1.5;
    }

    .mode-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 14px;
      padding: 5px;
      background: #e8e1d7;
      border-radius: 999px;
    }

    .mode-switch button {
      min-height: 44px;
      background: transparent;
      color: var(--text);
    }

    .mode-switch button.active {
      background: var(--white);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .camera {
      overflow: hidden;
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 4;
      background: #111;
      border-radius: 20px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.14);
    }

    video,
    #photoPreview {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #photoPreview,
    #mediaPreview {
      display: none;
    }

    #timer {
      display: none;
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(164, 61, 61, 0.92);
      color: white;
      font-weight: bold;
    }

    canvas {
      display: none;
    }

    .zoom {
      display: none;
      margin: 16px 4px 4px;
      text-align: left;
    }

    .zoom label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 7px;
      font-weight: bold;
    }

    .zoom input {
      width: 100%;
    }

    .buttons {
      display: grid;
      gap: 12px;
      margin-top: 18px;
    }

    button {
      width: 100%;
      min-height: 54px;
      padding: 14px 18px;
      border: 0;
      border-radius: 999px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .primary {
      background: var(--accent);
      color: var(--white);
    }

    .recording {
      background: var(--danger);
      color: var(--white);
    }

    .secondary {
      background: var(--white);
      color: var(--text);
      border: 1px solid #d7d0c5;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.6;
    }

    #captureButton,
    #uploadButton,
    #retakeButton {
      display: none;
    }

    #message {
      min-height: 25px;
      margin-top: 16px;
      line-height: 1.4;
    }

    iframe {
      display: none;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>Zanda & Emma</h1>

    <p class="subtitle">
      Help us capture the celebration!<br>
      Take a photo or a 10-second video.
    </p>

    <div class="mode-switch">
      <button id="photoMode" class="active" type="button">
        Photo
      </button>

      <button id="videoMode" type="button">
        Video
      </button>
    </div>

    <section class="camera">
      <video
        id="camera"
        autoplay
        playsinline
        muted
      ></video>

      <img
        id="photoPreview"
        alt="Your captured wedding photo"
      >

      <video
        id="mediaPreview"
        playsinline
        controls
      ></video>

      <span id="timer">10 seconds</span>

      <canvas id="canvas"></canvas>
    </section>

    <div id="zoomBox" class="zoom">
      <label for="zoomSlider">
        <span>Zoom</span>
        <span id="zoomValue">1×</span>
      </label>

      <input
        id="zoomSlider"
        type="range"
        step="0.1"
      >
    </div>

    <div class="buttons">
      <button
        id="startButton"
        class="primary"
        type="button"
      >
        Open camera
      </button>

      <button
        id="captureButton"
        class="primary"
        type="button"
      >
        Take photo
      </button>

      <button
        id="uploadButton"
        class="primary"
        type="button"
      >
        Add to wedding album
      </button>

      <button
        id="retakeButton"
        class="secondary"
        type="button"
      >
        Retake
      </button>
    </div>

    <p id="message"></p>

    <form
      id="uploadForm"
      method="post"
      target="uploadFrame"
      hidden
    >
      <input
        type="hidden"
        name="key"
        id="uploadKey"
      >

      <input
        type="hidden"
        name="mediaData"
        id="mediaData"
      >
    </form>

    <iframe
      id="uploadFrame"
      name="uploadFrame"
    ></iframe>
  </main>

  <script>
    const APPS_SCRIPT_URL =
      'PASTE_YOUR_APPS_SCRIPT_EXEC_URL_HERE';

    const UPLOAD_KEY =
      'ZANDA-EMMA-WEDDING-2026';

    const VIDEO_SECONDS = 10;

    const camera =
      document.getElementById('camera');

    const canvas =
      document.getElementById('canvas');

    const photoPreview =
      document.getElementById('photoPreview');

    const mediaPreview =
      document.getElementById('mediaPreview');

    const timer =
      document.getElementById('timer');

    const message =
      document.getElementById('message');

    const photoMode =
      document.getElementById('photoMode');

    const videoMode =
      document.getElementById('videoMode');

    const startButton =
      document.getElementById('startButton');

    const captureButton =
      document.getElementById('captureButton');

    const uploadButton =
      document.getElementById('uploadButton');

    const retakeButton =
      document.getElementById('retakeButton');

    const zoomBox =
      document.getElementById('zoomBox');

    const zoomSlider =
      document.getElementById('zoomSlider');

    const zoomValue =
      document.getElementById('zoomValue');

    const uploadForm =
      document.getElementById('uploadForm');

    let mode = 'photo';
    let stream = null;
    let videoTrack = null;
    let recorder = null;
    let recordedChunks = [];
    let capturedMedia = '';
    let uploadedMimeType = '';
    let countdown = null;
    let stopTimeout = null;
    let uploadStarted = false;
    let uploadTimeout = null;

    uploadForm.action = APPS_SCRIPT_URL;

    document.getElementById('uploadKey').value =
      UPLOAD_KEY;

    function setMode(nextMode) {
      if (
        recorder &&
        recorder.state === 'recording'
      ) {
        return;
      }

      mode = nextMode;

      photoMode.classList.toggle(
        'active',
        mode === 'photo'
      );

      videoMode.classList.toggle(
        'active',
        mode === 'video'
      );

      captureButton.textContent =
        mode === 'photo'
          ? 'Take photo'
          : 'Start 10-second video';

      resetPreview();
    }

    async function startCamera() {
      message.textContent =
        'Opening your camera…';

      try {
        stream =
          await navigator.mediaDevices.getUserMedia({
            audio: true,
            video: {
              facingMode: {
                ideal: 'environment'
              },
              width: {
                ideal: 1280
              },
              height: {
                ideal: 720
              }
            }
          });

        camera.srcObject = stream;
        await camera.play();

        videoTrack =
          stream.getVideoTracks()[0];

        configureZoom();

        startButton.style.display = 'none';
        captureButton.style.display = 'block';
        message.textContent = '';
      } catch (error) {
        message.textContent =
          'Camera access was not allowed. Please allow camera and microphone access, then try again.';
      }
    }

    function configureZoom() {
      zoomBox.style.display = 'none';

      if (
        !videoTrack ||
        !videoTrack.getCapabilities
      ) {
        return;
      }

      const capabilities =
        videoTrack.getCapabilities();

      if (!capabilities.zoom) {
        return;
      }

      zoomSlider.min =
        capabilities.zoom.min;

      zoomSlider.max =
        capabilities.zoom.max;

      zoomSlider.step =
        capabilities.zoom.step || 0.1;

      zoomSlider.value =
        videoTrack.getSettings().zoom ||
        capabilities.zoom.min;

      zoomValue.textContent =
        Number(zoomSlider.value).toFixed(1) +
        '×';

      zoomBox.style.display = 'block';
    }

    async function changeZoom() {
      if (!videoTrack) {
        return;
      }

      const zoom =
        Number(zoomSlider.value);

      zoomValue.textContent =
        zoom.toFixed(1) + '×';

      try {
        await videoTrack.applyConstraints({
          advanced: [
            {
              zoom: zoom
            }
          ]
        });
      } catch (error) {
        message.textContent =
          'This phone could not change the camera zoom.';
      }
    }

    function capture() {
      if (mode === 'photo') {
        takePhoto();
      } else if (
        recorder &&
        recorder.state === 'recording'
      ) {
        stopRecording();
      } else {
        startRecording();
      }
    }

    function takePhoto() {
      if (
        !camera.videoWidth ||
        !camera.videoHeight
      ) {
        message.textContent =
          'The camera is still starting. Please try again.';

        return;
      }

      const maximumDimension = 1800;

      const scale = Math.min(
        1,
        maximumDimension /
          Math.max(
            camera.videoWidth,
            camera.videoHeight
          )
      );

      canvas.width =
        Math.round(
          camera.videoWidth * scale
        );

      canvas.height =
        Math.round(
          camera.videoHeight * scale
        );

      canvas
        .getContext('2d')
        .drawImage(
          camera,
          0,
          0,
          canvas.width,
          canvas.height
        );

      uploadedMimeType = 'image/jpeg';

      capturedMedia =
        canvas.toDataURL(
          uploadedMimeType,
          0.86
        );

      photoPreview.src = capturedMedia;

      showPreview('photo');
    }

    function chooseVideoMimeType() {
      const choices = [
        'video/mp4;codecs=h264,aac',
        'video/mp4',
        'video/webm;codecs=vp8,opus',
        'video/webm'
      ];

      return (
        choices.find(type =>
          MediaRecorder.isTypeSupported(type)
        ) || ''
      );
    }

    function startRecording() {
      if (!window.MediaRecorder) {
        message.textContent =
          'Video recording is not supported by this browser.';

        return;
      }

      recordedChunks = [];

      const preferredType =
        chooseVideoMimeType();

      const options = {
        videoBitsPerSecond: 2500000
      };

      if (preferredType) {
        options.mimeType = preferredType;
      }

      try {
        recorder =
          new MediaRecorder(
            stream,
            options
          );
      } catch (error) {
        message.textContent =
          'This phone could not start video recording.';

        return;
      }

      recorder.ondataavailable = event => {
        if (
          event.data &&
          event.data.size > 0
        ) {
          recordedChunks.push(event.data);
        }
      };

      recorder.onstop = finishVideo;

      recorder.start(250);

      let secondsLeft = VIDEO_SECONDS;

      timer.textContent =
        secondsLeft + ' seconds';

      timer.style.display = 'block';

      captureButton.textContent =
        'Stop recording';

      captureButton.classList.add(
        'recording'
      );

      photoMode.disabled = true;
      videoMode.disabled = true;

      message.textContent = 'Recording…';

      countdown = setInterval(() => {
        secondsLeft -= 1;

        timer.textContent =
          secondsLeft +
          (
            secondsLeft === 1
              ? ' second'
              : ' seconds'
          );
      }, 1000);

      stopTimeout = setTimeout(
        stopRecording,
        VIDEO_SECONDS * 1000
      );
    }

    function stopRecording() {
      clearInterval(countdown);
      clearTimeout(stopTimeout);

      timer.style.display = 'none';

      if (
        recorder &&
        recorder.state === 'recording'
      ) {
        recorder.stop();
      }
    }

    function finishVideo() {
      uploadedMimeType =
        (
          recorder.mimeType ||
          'video/mp4'
        ).split(';')[0];

      const blob =
        new Blob(
          recordedChunks,
          {
            type: uploadedMimeType
          }
        );

      const reader =
        new FileReader();

      reader.onloadend = () => {
        capturedMedia =
          reader.result;

        mediaPreview.src =
          URL.createObjectURL(blob);

        showPreview('video');
      };

      reader.readAsDataURL(blob);

      captureButton.classList.remove(
        'recording'
      );

      photoMode.disabled = false;
      videoMode.disabled = false;
    }

    function showPreview(kind) {
      camera.style.display = 'none';

      photoPreview.style.display =
        kind === 'photo'
          ? 'block'
          : 'none';

      mediaPreview.style.display =
        kind === 'video'
          ? 'block'
          : 'none';

      captureButton.style.display =
        'none';

      uploadButton.style.display =
        'block';

      retakeButton.style.display =
        'block';

      zoomBox.style.display = 'none';

      message.textContent =
        'Happy with it? Add it to the wedding album.';
    }

    function resetPreview() {
      capturedMedia = '';
      uploadedMimeType = '';

      photoPreview.removeAttribute('src');

      mediaPreview.pause();
      mediaPreview.removeAttribute('src');

      photoPreview.style.display = 'none';
      mediaPreview.style.display = 'none';
      camera.style.display = 'block';

      uploadButton.style.display = 'none';
      retakeButton.style.display = 'none';

      captureButton.style.display =
        stream ? 'block' : 'none';

      captureButton.textContent =
        mode === 'photo'
          ? 'Take photo'
          : 'Start 10-second video';

      if (stream) {
        configureZoom();
      }

      message.textContent = '';
    }

    function uploadMedia() {
      if (!capturedMedia) {
        return;
      }

      uploadStarted = true;
      uploadButton.disabled = true;
      retakeButton.disabled = true;

      message.textContent =
        uploadedMimeType.indexOf('video/') === 0
          ? 'Uploading your video—please keep this page open…'
          : 'Adding your photo to the wedding album…';

      document
        .getElementById('mediaData')
        .value = capturedMedia;

      uploadForm.submit();

      clearTimeout(uploadTimeout);

      uploadTimeout = setTimeout(() => {
        if (!uploadStarted) {
          return;
        }

        uploadStarted = false;
        uploadButton.disabled = false;
        retakeButton.disabled = false;

        message.textContent =
          'The upload is taking too long. Please check your connection and try again.';
      }, 60000);
    }

    window.addEventListener(
      'message',
      event => {
        const result = event.data;

        if (
          !result ||
          result.source !==
            'party-cam-upload' ||
          !uploadStarted
        ) {
          return;
        }

        clearTimeout(uploadTimeout);

        uploadStarted = false;
        uploadButton.disabled = false;
        retakeButton.disabled = false;

        if (result.status === 'success') {
          resetPreview();

          message.textContent =
            'Added! Thank you. You can capture another moment.';
        } else {
          message.textContent =
            'The upload failed: ' +
            (
              result.message ||
              'Please try again.'
            );
        }
      }
    );

    photoMode.addEventListener(
      'click',
      () => setMode('photo')
    );

    videoMode.addEventListener(
      'click',
      () => setMode('video')
    );

    startButton.addEventListener(
      'click',
      startCamera
    );

    captureButton.addEventListener(
      'click',
      capture
    );

    retakeButton.addEventListener(
      'click',
      resetPreview
    );

    uploadButton.addEventListener(
      'click',
      uploadMedia
    );

    zoomSlider.addEventListener(
      'input',
      changeZoom
    );
  </script>
</body>
</html>
